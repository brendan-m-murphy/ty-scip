[package]
name = "scip-graphify"
version = "0.1.0"
description = "Project SCIP indexes into Graphify-compatible JSON"
authors = ["Brendan Murphy"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/brendan-m-murphy/ty-scip"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
protobuf = "=3.7.2"
scip = "=0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
